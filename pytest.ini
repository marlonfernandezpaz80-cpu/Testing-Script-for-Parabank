[pytest]
addopts = -v -s -l -m "not creates_data"
#base_url = https://parabank.parasoft.com/parabank/
base_url = http://localhost:8080/parabank/
testpaths = tests
markers =
    smoke: pruebas criticas
    regression: pruebas no criticas
    creates_data: pruebas que crean datos
    negative: pruebas de comportamiento inválido o no permitido

